[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-scanner-client"
version = "0.1.0"
description = "Raspberry Pi client for local symbol inference and scanner API communication."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "numpy>=1.26,<2.3",
    "pillow>=11,<13",
    "pydantic-settings>=2.7,<3",
    "textual>=8.2.8",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
camera-opencv = [
    "opencv-python-headless>=4.10,<5",
]
tensorflow = [
    "tensorflow>=2.20,<2.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[project.scripts]
ai-scanner-client = "ai_scanner_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_scanner_client = ["tui/*.tcss"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
